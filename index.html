<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عرض سعر - كازانيست</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f8;--panel:#fff;--ink:#16203d;--mut:#5b6580;--line:#d5dae6;--navy:#15234a;--acc:#15234a;--onacc:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--panel:#1a1f2e;--ink:#e8ebf5;--mut:#9aa3bd;--line:#2d3550;--acc:#8fa6ee;--onacc:#10131c}}
:root[data-theme="dark"]{--bg:#10131c;--panel:#1a1f2e;--ink:#e8ebf5;--mut:#9aa3bd;--line:#2d3550;--acc:#8fa6ee;--onacc:#10131c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;font-size:14px}
.app{display:grid;grid-template-columns:400px 1fr;gap:20px;padding:16px;align-items:start}
.ed{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
.ed h3{margin:14px 0 8px;font-size:15px}
.ed h3:first-child{margin-top:0}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
input,textarea,select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);margin-top:3px}
textarea{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 10px}
button.p{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tot{font-weight:700;color:var(--acc)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
/* paper */
.wrap{overflow:auto}
#lh{display:none}
.page{width:210mm;height:297mm;position:relative;margin:0 auto 14px;background:#fff;color:#111;box-shadow:0 2px 14px rgba(0,0,0,.25);overflow:hidden;direction:rtl;break-after:page;page-break-after:always}
.pbg{display:block;position:absolute;inset:0;width:100%;height:100%}.hc,.fc{display:none;position:absolute;left:0;right:0;background:#fff}.hc{top:0;height:41mm}.fc{bottom:0;height:35mm}.nohdr .hc,.noftr .fc{display:block}
.pc{position:absolute;top:44mm;left:14mm;right:14mm;height:217mm;display:flex;flex-direction:column;overflow:hidden;font-size:11.5px;line-height:1.7}
.pc>*{flex-shrink:0}
.meta{display:flex;justify-content:space-between;margin-bottom:6px;font-weight:600}
.meta div{line-height:1.9}
.intro{font-size:13px;font-weight:700;margin:8px 0 8px;color:#15234a;line-height:1.8}
table.q{width:100%;border-collapse:collapse;table-layout:fixed}
table.q th{background:#15234a;color:#fff;padding:6px 4px;font-size:12px;border:1px solid #15234a}
table.q td{border:1px solid #cfd5e3;padding:6px;text-align:center;vertical-align:middle;word-wrap:break-word}
table.q td.nm{text-align:right;vertical-align:top;font-size:12px;line-height:1.75}.dsc{white-space:normal;text-align:justify}.trow{display:flex;gap:6px;align-items:flex-start;margin-top:6px}.trow textarea{margin:0}
table.q td.nm b{display:block;font-size:12.5px;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid #e1e5ee}
table.q td.im img{display:block;margin:3px auto}
table.q tr.sum td{background:#f1f3f8;font-weight:700}
table.q tr.fin td{background:#f1f3f8;color:#15234a;font-weight:700;font-size:12.5px}
.foot{margin-top:14px}
.terms b{font-size:13px;color:#15234a}
.terms div{margin-top:3px}
.sign{display:flex;justify-content:space-between;align-items:center;margin-top:14px;text-align:center;font-size:11px;line-height:1.7}
.sign .who{width:34%}.sign .who b{font-size:12px}
.sign img{mix-blend-mode:multiply}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.th{position:relative}.th img{width:48px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.th button{position:absolute;top:-6px;left:-6px;padding:0 5px;line-height:16px;border-radius:50%}
@media (max-width:1000px){.app{grid-template-columns:1fr}.ed{position:static;max-height:none}}
@media print{
 @page{size:A4;margin:0}
 html,body{background:#fff}
 .ed,.no-print{display:none!important}
 .app{display:block;padding:0}.wrap{overflow:visible}
 .page{box-shadow:none;margin:0;height:296.6mm}
 .page:last-child{break-after:auto;page-break-after:auto}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.mh,.mf{display:none;position:absolute}
.mh{mix-blend-mode:multiply;top:9mm;left:50%;transform:translateX(-50%);width:80mm}
.mf{left:0;right:0;bottom:0;height:20mm;background:#2f58c0;color:#fff;direction:ltr;padding:0 12mm;justify-content:space-between;font-family:Arial,Helvetica,sans-serif;font-size:11.5px}
.mf .c{display:flex;flex-direction:column;justify-content:center;gap:7px}
.mf .i{display:flex;align-items:center;gap:6px;white-space:nowrap;height:15px}
.mf svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.6;flex-shrink:0}
.ms .pbg{display:none}.ms .mh{display:block}.ms .mf{display:flex}
.ms.nohdr .mh,.ms.noftr .mf{display:none}
.ms table.q th{background:#2f58c0;border-color:#2f58c0}
.ms .intro,.ms .terms b,.ms table.q tr.fin td{color:#2f58c0}
</style>
</head>

const DEFT=['الدفع نقدًا أو بموجب أمر دفع على حساب الشركة البنك الأهلي المصري – فرع الحرية | رقم الحساب: 5023070588601600018 | IBAN:EG780003050230705886016000180','الدفع نقدا أو بشيك او بتحويل بنكي 50% مع امر التوريد + 50% مع استلام البضاعه','التوريد خلال اسبوعين عمل من استلام امر التوريد . وفي حاله عدم وجود منتج يتم التنسيق','الاسعار شامله ضريبة القيمة المضافة بنسبة 14%','الاسعار ساريه حتي 5 ايام من تاريخه ويجدد بخطاب رسمي من الشركة'];
const PRE=[...DEFT,'الدفع 50% مع أمر التوريد والعقد، و35% بعد مرور نصف الوقت، و15% عند التسليم','التوريد في خلال 20 يوم.','الأسعار لا تشمل ضريبة القيمة المضافة 14%.'];
function fixT(o){if(!o.terms||o.tv!==2){o.terms=DEFT.join(NL);o.tv=2}}
function toggleVat(){S.vat=!S.vat;draw()}
function vatUI(){const b=$('#vatb');if(!b)return;const sub=S.items.reduce((a,it)=>a+total(it),0);b.textContent=S.vat?'إلغاء ضريبة 14% ('+fmt(Math.round(sub*14)/100)+')':'إضافة ضريبة 14% على الإجمالي';b.className=S.vat?'':'p'}
S=S||fresh();S.items.forEach(norm);L.forEach(norm);fixT(S);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function persistLib(){try{localStorage.setItem(LIB,JSON.stringify(L))}catch(e){alert('المساحة المحفوظة ممتلئة، قلل عدد الصور')}}
const fmt=n=>(Number(n)||0).toLocaleString('en-US');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'long',year:'numeric'}):'';
const get=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);
function set(o,p,v){const k=p.split('.');const l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v}
function resize(file,max,png){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;const x=c.getContext('2d');if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);r(c.toDataURL(png?'image/png':'image/jpeg',.78))};im.src=fr.result};fr.readAsDataURL(file)})}
const total=it=>(Number(it.qty)||0)*(Number(it.price)||0);
function bind(){document.querySelectorAll('[data-k]').forEach(el=>{const v=get(S,el.dataset.k);if(el.type==='checkbox')el.checked=!!v;else el.value=v??''})}
document.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',()=>{set(S,el.dataset.k,el.type==='checkbox'?el.checked:el.value);draw()}));
function itemsUI(){
 $('#items').innerHTML=S.items.map((it,i)=>`<div class="card" data-i="${i}">
 <div class="row"><b>صنف ${i+1}</b><button data-a="del">حذف</button></div>
 <label>اسم الصنف<input data-f="name" value="${esc(it.name)}"></label>
 <label>التفاصيل<textarea data-f="desc" rows="3">${esc(it.desc)}</textarea></label>
 <div class="g2"><label>الكمية<input type="number" min="0" data-f="qty" value="${it.qty}"></label><label>سعر الوحدة<input type="number" min="0" data-f="price" value="${it.price}"></label></div>
 <div class="row"><span>الإجمالي: <span class="tot">${fmt(total(it))}</span></span></div>
 <div class="thumbs">${it.imgs.map((s,j)=>`<span class="th"><img src="${s}" alt=""><button data-a="rmimg" data-j="${j}" aria-label="حذف الصورة">×</button></span>`).join('')}</div>
 <div class="row"><label style="margin:0;flex:1">صور (${it.imgs.length}/${MAXI}) - اختياري<input type="file" accept="image/*" multiple data-f="img"></label><button data-a="save">حفظ بالمكتبة</button></div></div>`).join('');
 libUI();
}
function libUI(){$('#lib').innerHTML='<option value="">إضافة صنف من المكتبة المحفوظة…</option>'+L.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join('')}
$('#lib').onchange=e=>{if(e.target.value==='')return;const p=L[+e.target.value];S.items.push({...p,qty:1,imgs:[...p.imgs]});e.target.value='';itemsUI();draw()};
$('#items').addEventListener('input',e=>{const f=e.target.dataset.f;if(!f||f==='img')return;const c=e.target.closest('.card'),it=S.items[c.dataset.i];it[f]=e.target.value;c.querySelector('.tot').textContent=fmt(total(it));draw()});
$('#items').addEventListener('change',async e=>{if(e.target.dataset.f!=='img')return;const it=S.items[e.target.closest('.card').dataset.i];const fs=[...e.target.files].slice(0,MAXI-it.imgs.length);for(const f of fs)it.imgs.push(await resize(f,450,false));itemsUI();draw()});
$('#items').addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;const i=+e.target.closest('.card').dataset.i,it=S.items[i];
 if(a==='del'){S.items.splice(i,1)}
 else if(a==='rmimg'){it.imgs.splice(+e.target.dataset.j,1)}
 else if(a==='save'){if(!it.name){alert('اكتب اسم الصنف أولاً');return}const {qty,...p}=it;p.imgs=[...it.imgs];const j=L.findIndex(x=>x.name===p.name);j>=0?L[j]=p:L.push(p);persistLib();libUI();return}
 itemsUI();draw()});
function addItem(){S.items.push(blank());itemsUI();draw()}

function newQ(){if(confirm('بدء عرض جديد؟ سيتم مسح البيانات الحالية (المكتبة تبقى محفوظة).')){const o=S;S=fresh();S.sales=o.sales;S.mgr=o.mgr;S.terms=o.terms;S.stamp=o.stamp;bind();itemsUI();termsUI();draw()}}
function exportJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='quote-'+(S.client||'draft').replace(/\s+/g,'_')+'-'+S.date+'.json';a.click()}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(fresh(),JSON.parse(r.result));S.items.forEach(norm);fixT(S);bind();itemsUI();termsUI();draw()}catch(x){alert('الملف غير صالح')}};r.readAsText(f)};

/* ---- preview & pagination ---- */
const DIM=new Map();
async function preload(){
 const srcs=[...new Set(S.items.flatMap(i=>i.imgs).concat([S.stamp||$('#st0').src]))].filter(s=>!DIM.has(s));
 await Promise.all(srcs.map(s=>new Promise(r=>{const im=new Image();im.onload=()=>{DIM.set(s,[im.naturalWidth,im.naturalHeight]);r()};im.onerror=r;im.src=s})));
 try{await document.fonts.ready}catch(e){}
}
function sized(src,mw,mh){const[w,h]=DIM.get(src)||[1,1];const s=Math.min(mw*K/w,mh*K/h);return`<img src="${src}" style="width:${w*s}px;height:${h*s}px">`}
const mk=h=>{const t=document.createElement('tbody');t.innerHTML=h;return t.firstElementChild};
function descH(d){return esc(d).split('•').map(x=>x.trim()).map((x,i)=>i?'• '+x:x).filter((x,i)=>i||x).join('<br>')}
const IC={g:`<circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4" ry="10"/><path d="M2 12h20"/>`,m:`<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7 10-7"/>`,f:`<circle cx="12" cy="12" r="10"/><path d="M13.5 20v-7.5h2.7M13.5 12.5H11m2.5 0V10c0-1.8.9-2.8 2.7-2.8"/>`,w:`<circle cx="12" cy="12" r="10"/><path d="M8 7c0 5 4 9 9 9l1-3-3-1-1 1c-1-.4-3-2-3.5-3.5l1-1-1-3z"/>`,x:`<rect x="6" y="3" width="12" height="6"/><rect x="3" y="9" width="18" height="9" rx="1"/><path d="M7 14h10v6H7z"/>`};
const ic=k=>`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;
const MF=`<div class="c"><div class="i">${ic('g')}www.almasriacompany.com</div><div class="i">${ic('f')}Panasonic MOS</div></div><div class="c"><div class="i"></div><div class="i">${ic('w')}01060300016</div></div><div class="c"><div class="i">${ic('m')}info@almasriacompany.com</div><div class="i">${ic('x')}0020842202790</div></div>`;
let tok=0;
function togBrand(){S.brand=S.brand==='ms'?'cn':'ms';draw()}
function togBar(k){if(k===2)S.noStamp=!S.noStamp;else if(k)S.noFtr=!S.noFtr;else S.noHdr=!S.noHdr;draw()}
function applyBars(){const r=$('#pages');if(!r)return;r.classList.toggle('nohdr',!!S.noHdr);r.classList.toggle('ms',S.brand==='ms');$('#bb').textContent=S.brand==='ms'?'تبديل لكازانيست':'تبديل للمصرية';r.classList.toggle('noftr',!!S.noFtr);$('#bs').textContent=S.noStamp?'إظهار الختم':'إخفاء الختم';$('#bh').textContent=S.noHdr?'إظهار الهيدر':'إخفاء الهيدر';$('#bf').textContent=S.noFtr?'إظهار الفوتر':'إخفاء الفوتر'}
async function draw(){persist();vatUI();applyBars();const t=++tok;await preload();if(t!==tok)return;paginate()}
function paginate(){
 const sub=S.items.reduce((a,it)=>a+total(it),0),vat=S.vat?Math.round(sub*.14*100)/100:0;
 const hasImg=S.items.some(it=>it.imgs.length),cols=hasImg?5:4;
 const head=`<thead><tr><th style="width:7mm">م</th>${hasImg?'<th style="width:40mm">الصورة</th>':''}<th>الصنف</th><th style="width:13mm">الكمية</th><th style="width:19mm">السعر</th><th style="width:22mm">الإجمالي</th></tr></thead>`;
 const row=(it,i)=>{const n=it.imgs.length,mh=Math.min(62,180/n-3);return`<tr><td>${i+1}</td>${hasImg?`<td class="im">${it.imgs.map(s=>sized(s,36,mh)).join('')}</td>`:''}<td class='nm'><b>${esc(it.name)}</b><div class='dsc'>${descH(it.desc)}</div></td><td>${fmt(it.qty)}</td><td>${fmt(it.price)}</td><td>${fmt(total(it))}</td></tr>`};
 const sums=[`<tr class="sum"><td colspan="${cols}">إجمالي قبل الضريبة</td><td>${fmt(sub)}</td></tr>`,`<tr class="sum"><td colspan="${cols}">ضريبة القيمة المضافة (14%)</td><td>${fmt(vat)}</td></tr>`,`<tr class="fin"><td colspan="${cols}">الإجمالي النهائي</td><td>${fmt(sub+vat)}</td></tr>`];
 const who=p=>`<div class="who"><b>${esc(p.role)}</b><br>${esc(p.name)}<br><span dir="ltr">${esc(p.phone)}</span><br><span dir="ltr">${esc(p.email)}</span></div>`;
 const stamp=S.noStamp?'':sized($('#st0').src,56,26);
 const root=$('#pages');root.innerHTML='';
 let pc,tb;
 const page=()=>{const pg=document.createElement('div');pg.className='page';const bg=$('#lh').cloneNode();bg.removeAttribute('id');bg.className='pbg';pg.appendChild(bg);pg.insertAdjacentHTML('beforeend',`<div class='hc'></div><div class='fc'></div>`);pg.insertAdjacentHTML('beforeend','<img class="mh" src="'+$('#mh0').src+'" alt=""><div class="mf">'+MF+'</div>');pc=document.createElement('div');pc.className='pc';pg.appendChild(pc);root.appendChild(pg)};
 const tbl=()=>{const t=document.createElement('table');t.className='q';t.innerHTML=head;tb=document.createElement('tbody');t.appendChild(tb);pc.appendChild(t)};
 const over=()=>pc.scrollHeight>pc.clientHeight+1;
 const group=hs=>{const els=hs.map(mk);els.forEach(e=>tb.appendChild(e));if(over()&&tb.children.length>els.length){els.forEach(e=>e.remove());page();tbl();els.forEach(e=>tb.appendChild(e))}};
 page();
 pc.insertAdjacentHTML('beforeend',`<div class="meta"><div>السادة / ${esc(S.client)}<br>عناية / ${esc(S.attn)}<br>التاريخ: ${fd(S.date)}</div><div>نوع العرض: ${esc(S.type)}<br>صالح حتى: ${fd(S.valid)}</div></div><div class="intro">تتشرف كازانيست، وهي الامتداد الرقمي لـ/ الشركة المصرية لمهمات المكاتب، بتقديم عرض السعر لسيادتكم للمنتجات التالية.</div>`);
 tbl();
 S.items.forEach((it,i)=>group([row(it,i)]));
 group(sums);
 const f=document.createElement('div');f.className='foot';
 f.innerHTML=`<div class="terms"><b>الشروط والأحكام:</b>${S.terms.split('\n').filter(x=>x.trim()).map(x=>`<div>• ${esc(x)}</div>`).join('')}</div><div class="sign">${who(S.sales)}<div>${stamp}</div>${who(S.mgr)}</div>`;
 pc.appendChild(f);
 if(over()){f.remove();page();pc.appendChild(f)}
 if(S.brand==='ms')root.querySelectorAll('.intro').forEach(n=>n.textContent='تتشرف شركة المصرية لمهمات المكاتب بتقديم عرض السعر لسيادتكم للمنتجات التالية.');
}
const TL=()=>S.terms.split(NL).filter(x=>x.trim());
const TS=a=>{S.terms=a.join(NL)};
function termsUI(){
 $('#tlist').innerHTML=TL().map((t,i)=>`<div class='trow' data-t='${i}'><button data-a='tdel'>حذف</button><textarea rows='2'>${esc(t)}</textarea></div>`).join('');
 $('#tpre').innerHTML='<option value="">إضافة من الشروط الجاهزة…</option>'+PRE.map((p,i)=>`<option value='${i}'>${esc(p.slice(0,55))}</option>`).join('');
}
$('#tadd').onclick=()=>{const v=$('#tnew').value.trim();if(!v)return;TS([...TL(),v]);$('#tnew').value='';termsUI();draw()};
$('#tnew').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#tadd').click()}});
$('#tpre').onchange=e=>{if(e.target.value==='')return;TS([...TL(),PRE[+e.target.value]]);termsUI();draw()};
$('#tlist').addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault()});
$('#tlist').addEventListener('input',e=>{const i=+e.target.closest('.trow').dataset.t,a=TL();a[i]=e.target.value||' ';TS(a);draw()});
$('#tlist').addEventListener('click',e=>{if(e.target.dataset.a!=='tdel')return;const a=TL();a.splice(+e.target.closest('.trow').dataset.t,1);TS(a);termsUI();draw()});
bind();itemsUI();termsUI();draw();
</script>
</body>
</html>
